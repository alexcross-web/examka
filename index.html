<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экзамка AI</title>
    <style>
        /* Полное обнуление отступов и фиксация */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden !important;
        }

        * {
            box-sizing: border-box;
        }

        /* 1. ПОЛНОЭКРАННЫЙ ПРЕЛОАДЕР НА ВЕСЬ ЭКРАН MOBILE */
        #loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 !important;
            padding: 0 !important;
        }

        .loader-container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        /* Круговой спиннер */
        .spinner {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #38bdf8;
            border-right: 4px solid #818cf8;
            animation: spin 1s linear infinite;
        }

        /* Текст статуса */
        .loader-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e2e8f0;
        }
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Ошибка интернета */
        .loader-error {
            display: none;
            color: #ef4444;
            font-size: 1rem;
            margin-top: 10px;
        }
        .retry-btn {
            display: none;
            margin: 20px auto 0;
            background-color: #222531;
            color: #fff;
            border: 1px solid #3f445b;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* 2. СКРЫТЫЙ СЛУЖЕБНЫЙ ФРЕЙМ (ОТКРЫВАЕТ САЙТ ВНУТРИ ПРИЛОЖЕНИЯ) */
        #app-frame {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 99998;
            background-color: #0b0f19;
        }
    </style>
</head>
<body>

    <!-- ОКНО ЗАГРУЗКИ (БУДЕТ ОТОБРАЖАТЬСЯ 3 СЕКУНДЫ) -->
    <div id="loader-overlay">
        <div class="loader-container">
            <div id="loader-spinner" class="spinner"></div>
            <div id="loader-status-text" class="loader-text pulse">Подключение к серверам EXAMKA AI...</div>
            <div id="loader-error-msg" class="loader-error">⚠️ Отсутствует подключение к интернету.</div>
            <button id="retry-button" class="retry-btn" onclick="window.location.reload()">Повторить попытку</button>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ ФРЕЙМ ДЛЯ ОБХОДА ВНЕШНЕГО БРАУЗЕРА -->
    <iframe id="app-frame" src="about:blank"></iframe>

    <script>
        const TARGET_URL = "https://examka.ai";

        // Исправление белого отступа снизу на мобильных экранах
        function fixMobileHeight() {
            const height = window.innerHeight + 'px';
            document.getElementById('loader-overlay').style.height = height;
            document.getElementById('app-frame').style.height = height;
        }
        window.addEventListener('resize', fixMobileHeight);
        window.addEventListener('orientationchange', fixMobileHeight);

        // Функция автоматического бесшовного перехода
        function autoRedirect() {
            if (navigator.onLine) {
                const frame = document.getElementById("app-frame");
                frame.src = TARGET_URL;
                frame.style.display = "block"; // Включаем фрейм во весь экран
                
                // Скрываем заставку только после начала загрузки во фрейме
                document.getElementById("loader-overlay").style.display = "none";
            } else {
                showOfflineError();
            }
        }

        // Отображение ошибки, если интернета нет
        function showOfflineError() {
            const spinner = document.getElementById("loader-spinner");
            const statusText = document.getElementById("loader-status-text");
            const errorMsg = document.getElementById("loader-error-msg");
            const retryBtn = document.getElementById("retry-button");

            spinner.style.borderTopColor = "#ef4444";
            spinner.style.borderRightColor = "#ef4444";
            spinner.style.animation = "none"; 
            statusText.textContent = "Не удалось подключиться";
            statusText.classList.remove("pulse");
            errorMsg.style.display = "block";
            retryBtn.style.display = "block";
        }

        document.addEventListener("DOMContentLoaded", function() {
            fixMobileHeight(); // Убираем отступы сразу при загрузке

            if (navigator.onLine) {
                // Запускаем таймер ровно на 3 секунды (3000 мс) до автоперехода
                setTimeout(autoRedirect, 3000);
            } else {
                showOfflineError();
            }

            // Если интернет появился, пока висит ошибка — автоматически перезагружаем для входа
            window.addEventListener('online', function() {
                window.location.reload();
            });
        });
    </script>

</body>
</html>
