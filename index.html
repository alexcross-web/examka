<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экзамка AI</title>
    <style>
        /* Базовое обнуление для мобильного WebView */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden !important;
        }

        * {
            box-sizing: border-box;
        }

        /* КРУГОВОЙ СПИННЕР */
        .spinner {
            width: 55px;
            height: 55px;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #38bdf8;
            border-right: 4px solid #818cf8;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* ЭКРАН 1: ИНИЦИАЛИЗАЦИЯ */
        #screen-init {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e2e8f0;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* ЭКРАН 2: ГЛАВНЫЙ ИНТЕРФЕЙС */
        #screen-main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #screen-main.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 420px;
        }

        /* Контейнер для спиннера на втором экране */
        .button-loader-zone {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ОШИБКА ИНТЕРНЕТА */
        .loader-error {
            display: none;
            color: #ef4444;
            font-size: 1rem;
            margin-top: 10px;
        }
        .retry-btn {
            display: none;
            margin: 20px auto 0;
            background-color: #222531;
            color: #fff;
            border: 1px solid #3f445b;
            padding: 12px 26px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ИНИЦИАЛИЗАЦИЯ -->
    <div id="screen-init">
        <div class="spinner" id="init-spinner"></div>
        <div class="loader-text" id="init-text">Инициализация AI ассистентов...</div>
        <div id="error-msg" class="loader-error">⚠️ Отсутствует подключение к интернету.</div>
        <button id="retry-button" class="retry-btn" onclick="window.location.reload()">Повторить попытку</button>
    </div>

    <!-- ЭКРАН 2: ГЛАВНЫЙ ИНТЕРФЕЙС -->
    <div id="screen-main">
        <span class="badge">EXAMKA AI</span>
        <h1>Самый умный AI<br>для студентов</h1>
        <p class="subtitle">Простой и мощный инструмент для создания качественных академических работ с помощью искусственного интеллекта.</p>
        
        <div class="button-loader-zone">
            <div class="spinner" style="width: 45px; height: 45px; margin: 0;"></div>
        </div>
    </div>

    <script>
        const TARGET_URL = "https://examka.ai";

        // Динамический расчет высоты под WebView
        function fixMobileHeight() {
            const height = window.innerHeight + 'px';
            document.getElementById('screen-init').style.height = height;
            document.getElementById('screen-main').style.height = height;
        }
        window.addEventListener('resize', fixMobileHeight);
        window.addEventListener('orientationchange', fixMobileHeight);

        // Функция прямого перехода
        function doDirectRedirect() {
            if (navigator.onLine) {
                // Использование location.replace стирает текущую заставку из истории переходов кнопки "Назад",
                // предотвращая бесконечные циклы возврата к загрузке в приложении.
                window.location.replace(TARGET_URL);
            } else {
                showOfflineError();
            }
        }

        // Ошибка сети
        function showOfflineError() {
            document.getElementById("screen-main").style.display = "none";
            const scrInit = document.getElementById("screen-init");
            scrInit.style.display = "flex";
            scrInit.style.opacity = "1";
            scrInit.style.visibility = "visible";

            const spinner = document.getElementById("init-spinner");
            const statusText = document.getElementById("init-text");
            
            spinner.style.borderTopColor = "#ef4444";
            spinner.style.borderRightColor = "#ef4444";
            spinner.style.animation = "none"; 
            statusText.textContent = "Не удалось подключиться";
            statusText.style.animation = "none";

            document.getElementById("error-msg").style.display = "block";
            document.getElementById("retry-button").style.display = "block";
        }

        document.addEventListener("DOMContentLoaded", function() {
            fixMobileHeight();

            if (navigator.onLine) {
                // ШАГ 1: Через 3 секунды переключаем экран заставки
                setTimeout(function() {
                    const scrInit = document.getElementById("screen-init");
                    const scrMain = document.getElementById("screen-main");
                    
                    scrInit.style.opacity = "0";
                    scrInit.style.visibility = "hidden";
                    scrMain.classList.add("visible");

                    // ШАГ 2: Еще через 3 секунды делаем нативный редирект
                    setTimeout(doDirectRedirect, 3000);

                }, 3000);
            } else {
                showOfflineError();
            }

            window.addEventListener('online', function() {
                window.location.reload();
            });
        });
    </script>

</body>
</html>
